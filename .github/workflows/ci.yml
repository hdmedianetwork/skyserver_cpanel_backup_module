name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -l whm-plugin/index.cgi
      - name: Shell syntax
        run: for f in install.sh bin/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Standalone installer builds
        run: scripts/build-installer.sh && bash -n dist/install-standalone.sh
      - name: VERSION is a version number
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' VERSION
