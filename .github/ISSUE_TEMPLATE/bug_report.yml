name: Bug report
description: Something in Backup Manager is not working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems should not be reported here.** See [SECURITY.md](https://github.com/hdmedianetwork/skyserver_cpanel_backup_module/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Backup Manager version
      description: "`cat /opt/skyserver-backup-module/VERSION`"
      placeholder: 0.9.3
    validations:
      required: true
  - type: input
    id: whm
    attributes:
      label: cPanel & WHM version and OS
      placeholder: WHM 134.0.23, AlmaLinux 9
  - type: textarea
    id: log
    attributes:
      label: Activity Log
      description: "The relevant lines from WHM → Backup Manager → Activity Log, or `tail -n 50 /var/log/skyserver-backup.log`. Remove customer names if needed."
      render: text
